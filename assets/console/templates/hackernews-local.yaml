#
# hackernews
#

campaign:
  mirrorDomain: hackernews.fake
  description: |
    Mirror for "hackernews.com" site.

    Local deployment, non-secure mirror on domain "hackernews.fake" and port 3080

proxies:
  - proxyId: default
    url: http://localhost:8080
    isEnabled: true

targets:
  - targetId: root
    accessLevel: landing
    donorSecure: true
    donorSub: 'news'
    donorDomain: ycombinator.com
    donorPort: 443
    mirrorSecure: false
    mirrorSub: '@'
    mirrorPort: 3080
    labels: ['hackernews']
    mainPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>HackerNews</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              text-align: center;
              padding: 10px;
            }
          </style>
        </head>
        <body>
          <h1>HackerNews site</h1>
        </body>
      </html>

    notFoundPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Not found</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              text-align: center;
              padding: 10px;
            }
          </style>
        </head>
        <body>
          <h1>Not found</h1>
        </body>
      </html>

    faviconIco: >
      AAABAAEAEBAAAAAAAABoBQAAFgAAACgAAAAQAAAAIAAAAAEACAAAAAAAAAEAAAAAAAAAAAAAAAEA
      AAAAAAD///8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    robotsTxt: |
      User-agent: *
      Disallow: /

    sitemapXml: ''
    isEnabled: true

  - targetId: google-www
    accessLevel: landing
    donorSecure: true
    donorSub: 'www'
    donorDomain: google.com
    donorPort: 443
    mirrorSecure: false
    mirrorSub: 'www.google'
    mirrorPort: 3080
    labels: ['google']
    isEnabled: true

redirectors:
  - redirectorId: simple
    page: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
      <% if (data.og_title) { %>
          <meta property="og:title" content="<%= data.og_title %>">
      <% } %>
      <% if (data.og_desc) { %>
          <meta property="og:description" content="<%= data.og_desc %>">
      <% } %>
      <% if (data.og_image) { %>
          <meta property="og:image" content="<%= data.og_image %>">
      <% } %>
      <% if (data.og_url) { %>
          <meta property="og:url" content="<%= data.og_url %>">
      <% } %>
          <title>You will be redirected...</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              text-align: center;
              padding: 10px;
            }
          </style>
        </head>
        <body>
          <p>You will be redirected...</p>
          <script>
            <% if (data.upgrade_url) { %>
              setTimeout(() => {
                window.location.assign("<%= data.upgrade_url %>");
              }, 1000);
            <% } %>
          </script>
        </body>
      </html>

    fields: ['og_title', 'og_description']

lures:
  - lureId: test
    path: /foo-bar-baz
    redirectorId: simple
    isEnabled: true

