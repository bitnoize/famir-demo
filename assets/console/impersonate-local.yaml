campaign:
  mirrorDomain: 'impersonate.fake'
  description: |
    Mirror for "impersonate.pro" site.

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'

  - proxyId: 'docker-default'
    url: 'http://tunnel:8080'

targets:
  - targetId: 'fp'
    accessLevel: 'transparent'
    donorSecure: true
    donorSub: 'fp'
    donorDomain: 'impersonate.pro'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: 'fp'
    mirrorPort: 80
    label: 'impersonate-fp'
    isEnabled: true
