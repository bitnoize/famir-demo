campaign:
  mirrorDomain: 'browserleaks.fake'
  description: |
    Mirror for "browserleaks.com" site.

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'

  - proxyId: 'docker-default'
    url: 'http://tunnel:8080'

targets:
  - targetId: 'apex'
    accessLevel: 'landing'
    donorSecure: true
    donorSub: '@'
    donorDomain: 'browserleaks.com'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: '@'
    mirrorPort: 80
    label: 'browserleaks'
    mainPage: 'browserleaks/main-page.html'
    notFoundPage: 'not-found-page.html'
    faviconIco: 'favicon.ico'
    robotsTxt: 'robots.txt'
    isEnabled: true

  - targetId: 'ipv6'
    accessLevel: 'transparent'
    donorSecure: true
    donorSub: 'ipv6'
    donorDomain: 'browserleaks.com'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: 'ipv6'
    mirrorPort: 80
    isEnabled: true

  - targetId: 'tls'
