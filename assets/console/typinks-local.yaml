campaign:
  mirrorDomain: 'typinks.fake'
  description: |
    Mirror for testing SSE connections.

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'
    isEnabled: true

targets:
  - targetId: 'sse'
    accessLevel: 'transparent'
    donorSecure: true
    donorSub: 'sse'
