campaign:
  mirrorDomain: 'typinks.fake'
  description: |
    Mirror for "typinks.com" site.

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'

  - proxyId: 'docker-default'
    url: 'http://tunnel:8080'

targets:
  - targetId: 'sse'
    accessLevel: 'transparent'
    donorSecure: true
    donorSub: 'sse'
    donorDomain: 'tools.typinks.com'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: 'sse'
    mirrorPort: 80
    label: 'typinks-sse'
    streamTimeout: 60000
    isEnabled: true
