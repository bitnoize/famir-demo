campaign:
  mirrorDomain: 'typinks.fake'
  description: |
    Mirror for testing SSE connections.

    ```sh
    # Testing with curl:
    curl http://sse.typinks.fake:3080/api/story \
      -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:109.0) Gecko/20100101 Firefox/115.0"
    ```

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'
    isEnabled: true

targets:
  - targetId: 'sse'
    accessLevel: 'transparent'
    donorSecure: true
    donorSub: 'sse'
    donorDomain: 'tools.typinks.com'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: 'sse'
    mirrorPort: 3080
    labels: ['typinks-sse']
    streamTimeout: 60000
    isEnabled: true
