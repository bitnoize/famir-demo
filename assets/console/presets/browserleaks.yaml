    accessLevel: 'landing'
    donorSecure: true
    donorSub: '@'
    donorDomain: 'browserleaks.com'
    donorPort: 443
    mirrorSecure: true
    mirrorSub: '@'
    mirrorPort: 443
    labels: ['browserleaks']
    mainPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Browser privacy tools</title>
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/blades.css" />
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/custom-demo.css" />
        </head>
        <body>
          <main class="container">
            <article>
              <h1>Browser privacy tools</h1>
            </article>
          </main>

          <footer>
            <a href="https://fake-mirrors.net" target="_blank">
              Fake Mirrors
            </a>
