campaign:
  mirrorDomain: 'hackernews.fake'
  description: |
    Mirror for "hackernews.com" site.

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'
    isEnabled: true

targets:
  - targetId: 'apex'
    accessLevel: 'landing'
    donorSecure: true
    donorSub: 'news'
    donorDomain: 'ycombinator.com'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: '@'
    mirrorPort: 3080
    labels: ['hackernews']
    mainPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Hacker News</title>
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/blades.css" />
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/custom-demo.css" />
        </head>
        <body>
          <main class="container">
            <article>
              <h1>Hacker News</h1>
            </article>
          </main>

          <footer>
            <a href="https://fake-mirrors.net" target="_blank">
              Fake Mirrors
            </a>
          </footer>
        </body>
      </html>

    notFoundPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Page not found</title>
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/blades.css" />
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/custom-demo.css" />
        </head>
        <body>
          <main class="container">
            <article>
              <h1>Page not found</h1>
              <a href="/">Back</a> to main page
            </article>
          </main>

          <footer>
            <a href="https://fake-mirrors.net" target="_blank">
              Fake Mirrors
            </a>
          </footer>
        </body>
      </html>

    faviconIco: >
      AAABAAEAEBAAAAAAAABoBQAAFgAAACgAAAAQAAAAIAAAAAEACAAAAAAAAAEAAAAAAAAAAAAAAAEA
      AAAAAAD///8AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    robotsTxt: |
      User-agent: *
      Disallow: /

    sitemapXml: ''
    isEnabled: true

  - targetId: 'google-www'
    accessLevel: 'landing'
    donorSecure: true
    donorSub: 'www'
    donorDomain: 'google.com'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: 'www.google'
    mirrorPort: 3080
    labels: ['google']
    isEnabled: true

redirectors:
  - redirectorId: 'simple'
    page: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <meta property="og:title" content="Hacker News" />
          <meta property="og:description" content="The oldest hacker news site" />
          <meta property="og:image" content="https://fake-mirrors.net/images/og-image.png" />
          <meta property="og:url" content="https://news.ycombinator.com" />
          <title>Hacker News</title>
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/blades.css" />
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/custom-demo.css" />
        </head>
        <body>
          <main class="container">
            <article>
              <h1>Hacker News</h1>
              Wait a second...
            </article>
          </main>

          <footer>
            <a href="https://fake-mirrors.net" target="_blank">
              Fake Mirrors
            </a>
          </footer>

          <script>
            <% if (data.upgrade_url) { %>
              setTimeout(() => {
                window.location.assign("<%= data.upgrade_url %>");
              }, 1000);
            <% } %>
          </script>
        </body>
      </html>

    fields: []

lures:
  - lureId: 'test'
    path: '/test'
    redirectorId: 'simple'
    isEnabled: true
