campaign:
  mirrorDomain: 'httpbin.fake-mirrors.net'
  description: |
    Mirror for "httpbin.org" site.

  upgradeSessionPath: '/dimoh.php'
  sessionCookieName: 'jahla'

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'
    isEnabled: true

targets:
  - targetId: 'apex'
    accessLevel: 'transparent'
    donorSecure: true
    donorSub: '@'
    donorDomain: 'httpbin.org'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: '@'
    mirrorPort: 443
    labels: ['httpbin']
    mainPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>HTTP Request & Response Service</title>
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/blades.css" />
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/custom-demo.css" />
        </head>
        <body>
          <main class="container">
            <article>
              <h1>HTTP Request & Response Service</h1>
            </article>
          </main>

          <footer>
            <a href="https://fake-mirrors.net" target="_blank">
              Fake Mirrors
            </a>
          </footer>
        </body>
      </html>

    notFoundPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
          <title>Page not found</title>
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/blades.css" />
          <link rel="stylesheet" href="https://fake-mirrors.net/styles/custom-demo.css" />
        </head>
        <body>
          <main class="container">
            <article>
              <h1>Page not found</h1>
              <a href="/">Back</a> to main page
            </article>
          </main>

          <footer>
            <a href="https://fake-mirrors.net" target="_blank">
              Fake Mirrors
            </a>
          </footer>
        </body>
      </html>

