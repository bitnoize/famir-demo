campaign:
  mirrorDomain: 'httpbin.fake-mirrors.net'
  description: |
    Mirror for "httpbin.org" site.

    Product deployment, secure mirror on domain "httpbin.fake-mirrors.net" and port 443

  upgradeSessionPath: '/dimoh.php'
  sessionCookieName: 'jahla'

proxies:
  - proxyId: 'default'
    url: 'http://localhost:8080'
    isEnabled: true

targets:
  - targetId: 'apex'
    accessLevel: 'transparent'
    donorSecure: true
    donorSub: '@'
    donorDomain: 'httpbin.org'
    donorPort: 443
    mirrorSecure: false
    mirrorSub: '@'
    mirrorPort: 443
    labels: ['httpbin']
    mainPage: |
      <!doctype html>
      <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>httpbin</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              text-align: center;
              padding: 10px;
            }
          </style>
        </head>
        <body>
          <h1>A simple HTTP Request & Response Service</h1>
        </body>
      </html>

    notFoundPage: |
      <!doctype html>
      <html lang="en">
