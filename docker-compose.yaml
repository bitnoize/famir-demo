version: '3.9'

services:
  console:
    image: famir-demo:latest
    environment:
      - NODE_ENV=production
      - LOGGER_LOG_LEVEL=debug
      - DATABASE_CONNECTION_URL=redis://default:$ecret@redis:6379/0
      - PRODUCER_CONNECTION_URL=redis://default:$ecret@redis:6379/1
    ports:
      - "127.0.0.1:3000:3000"
    command: ["node", "dist/console/loaders/net.js"]
    depends_on:
      - redis
    restart: unless-stopped

  reverse:
    image: famir-demo:latest
    environment:
      - NODE_ENV=production
      - LOGGER_LOG_LEVEL=debug
      - DATABASE_CONNECTION_URL=redis://default:$ecret@redis:6379/0
      - PRODUCER_CONNECTION_URL=redis://default:$ecret@redis:6379/1
    command: ["node", "dist/reverse/loaders/std.js"]
    depends_on:
      - redis
    restart: unless-stopped

  actions:
    image: famir-demo:latest
    environment:
      - NODE_ENV=production
      - LOGGER_LOG_LEVEL=debug
      - DATABASE_CONNECTION_URL=redis://default:$ecret@redis:6379/0
      - PRODUCER_CONNECTION_URL=redis://default:$ecret@redis:6379/1
      - STORAGE_END_POINT=silo
      - STORAGE_PORT=9000
      - STORAGE_ACCESS_KEY=admin
      - STORAGE_SECRET_KEY=$ecret
    command: ["node", "dist/actions/loaders/std.js"]
    depends_on:
      - redis
      - silo
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_ARGS=--requirepass $ecret --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "redis-data:/data"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "./misc/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "caddy-data:/data"
      - "caddy-config:/config"
    restart: unless-stopped

  silo:
    image: pgsty/silo:latest
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=$secret
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - "silo-data:/data"
    command: ["server", "/data"]
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  silo-data:
