networks:
  famir-net:
    driver: bridge

services:
  console:
    image: famir-demo:latest
    environment:
      - "NODE_ENV=production"
      - "LOGGER_LOG_LEVEL=info"
      - "DATABASE_CONNECTION_URL=redis://redis:6379/0"
      - "PRODUCER_CONNECTION_URL=redis://redis:6379/1"
      - "STORAGE_ENDPOINT=silo"
      - "STORAGE_PORT=9000"
      - "STORAGE_ACCESS_KEY=root"
      - "STORAGE_SECRET_KEY=strongpass"
    ports:
      - "127.0.0.1:5000:5000"
    command: ["node", "dist/console/loaders/net.js"]
    networks:
      - famir-net
    depends_on:
      - redis
      - tunnel
      - silo-prep
    restart: unless-stopped

  reverse:
    image: famir-demo:latest
    environment:
      - "NODE_ENV=production"
      - "LOGGER_LOG_LEVEL=info"
      - "DATABASE_CONNECTION_URL=redis://redis:6379/0"
      - "PRODUCER_CONNECTION_URL=redis://redis:6379/1"
    ports:
      - "127.0.0.1:3000:3000"
    command: ["node", "dist/reverse/loaders/std.js"]
    networks:
      - famir-net
    depends_on:
      - redis
      - tunnel
    restart: unless-stopped

  actions:
    image: famir-demo:latest
    environment:
      - "NODE_ENV=production"
      - "LOGGER_LOG_LEVEL=info"
      - "DATABASE_CONNECTION_URL=redis://redis:6379/0"
      - "PRODUCER_CONNECTION_URL=redis://redis:6379/1"
      - "CONSUMER_CONNECTION_URL=redis://redis:6379/1"
      - "STORAGE_ENDPOINT=silo"
      - "STORAGE_PORT=9000"
      - "STORAGE_ACCESS_KEY=root"
      - "STORAGE_SECRET_KEY=strongpass"
    command: ["node", "dist/actions/loaders/std.js"]
    networks:
      - famir-net
    depends_on:
      - redis
      - tunnel
      - silo-prep
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      - "REDIS_ARGS=--appendonly yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - "redis-data:/data"
    networks:
      - famir-net
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - "./conf/caddy/Caddyfile-docker:/etc/caddy/Caddyfile:ro"
      - "caddy-data:/data"
      - "caddy-config:/config"
    networks:
      - famir-net
    restart: unless-stopped

  silo:
    image: pgsty/silo:latest
    environment:
      - "MINIO_ROOT_USER=root"
      - "MINIO_ROOT_PASSWORD=strongpass"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - "silo-data:/data"
    command: ["server", "/data"]
    networks:
      - famir-net
    restart: unless-stopped

  silo-prep:
    image: pgsty/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set silo http://silo:9000 root strongpass;
      mc mb --ignore-existing silo/famir-demo;
      exit 0;
      "
    networks:
      - famir-net
    depends_on:
      - silo

  tunnel:
    image: gogost/gost
    command: ["-L", "http://0.0.0.0:8080"]
    networks:
      - famir-net
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  silo-data:
